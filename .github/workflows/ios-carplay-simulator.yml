name: CarPlay simulator

# Experimental — exercita a cena de CarPlay no Simulator. O target do app já
# aponta `CODE_SIGN_ENTITLEMENTS` para `HermesMobile/HermesMobile-CarPlay.entitlements`
# no projeto; o build é ad-hoc (sem equipe/perfil) e o Xcode embute as
# entitlements simuladas na seção __TEXT,__entitlements do executável, que é o que
# este workflow confere. Depois instala/lança o app no mock.
#
# Limitação conhecida: NÃO existe subcomando do `xcrun simctl` para abrir a tela
# de CarPlay; ela é habilitada pela GUI do Simulator (I/O > External Displays >
# CarPlay). Por isso o passo de abrir a janela é "best-effort" via AppleScript e
# pode não funcionar no runner; o roteiro manual está em REPORT-carplay.md.
#
# IMPORTANTE: `workflow_dispatch` só aparece depois que este arquivo existir no
# branch default (master). Ele NÃO foi pushado para master. Registre-o no master
# (ou copie o conteúdo) e dispare:
#   gh workflow run "CarPlay simulator" -R marcoant159/Hermes-iOS --ref <branch>

on:
  workflow_dispatch:
  push:
    branches: [wip/carplay]

jobs:
  carplay-simulator:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Escolher e iniciar o simulador
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds]
          pick = [d for d in devs if d["name"].startswith("iPhone") and "Pro" in d["name"]] or [d for d in devs if d["name"].startswith("iPhone")]
          print(pick[-1]["udid"])
          ')
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          defaults write com.apple.iphonesimulator CarPlay -bool YES || true
          defaults write com.apple.iphonesimulator CarPlayExtraOptions -bool YES || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build para o Simulator com entitlement de CarPlay (ad-hoc)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project HermesMobile.xcodeproj \
            -scheme HermesMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_IDENTITY=- PROVISIONING_PROFILE_SPECIFIER= \
            > "$RUNNER_TEMP/build.log" 2>&1 || {
              grep -nE "error:|error " "$RUNNER_TEMP/build.log" | head -60 || true
              tail -n 120 "$RUNNER_TEMP/build.log"
              exit 1
            }
          tail -n 10 "$RUNNER_TEMP/build.log"

      - name: Confirmar a entitlement embutida no binário
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name "HermesMobile.app" -type d | head -1)
          EXE="$APP/HermesMobile"
          echo "app: $APP"
          # Sem perfil de provisionamento (Simulator, assinatura ad-hoc) o xcent
          # "real" fica vazio. Porém o Xcode embute as entitlements simuladas na
          # seção __TEXT,__entitlements do executável. Confere-se por ali.
          echo "== codesign (pode vir vazio sem perfil) =="
          codesign -d --entitlements :- "$APP" | tee "$RUNNER_TEMP/entitlements.plist" || true
          echo "== seção __TEXT,__entitlements =="
          if grep -a "com.apple.developer.carplay-voice-based-conversation" "$EXE"; then
            echo "entitlement de CarPlay embutida no executável: OK"
          else
            echo "chave não encontrada no executável; dump da seção:"
            otool -s __TEXT __entitlements "$EXE" | head -20 || true
            exit 1
          fi

      - name: Instalar e lançar (modo mock)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name "HermesMobile.app" -type d | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" br.com.marcoant.hermes \
            UITEST_PAIRING_MODE=mock UITEST_DEFAULTS_SUITE=carplay-sim || true

      - name: Abrir a tela de CarPlay (best-effort, pode não funcionar)
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          open -a Simulator || true
          sleep 5
          osascript -e 'tell application "System Events" to tell process "Simulator" to click menu item "CarPlay" of menu 1 of menu item "External Displays" of menu 1 of menu bar item "I/O" of menu bar 1' || true
          sleep 8
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/simulator-screen.png" || true
          screencapture -x "$RUNNER_TEMP/desktop.png" || true

      - name: Publicar artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: carplay-simulator-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/simulator-screen.png
            ${{ runner.temp }}/desktop.png
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/entitlements.plist
          if-no-files-found: warn
          retention-days: 14
