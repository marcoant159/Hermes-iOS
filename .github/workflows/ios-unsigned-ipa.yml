name: Build unsigned IPA

# Compila o app iOS do Hermes-iOS SEM assinatura — a assinatura fica para o
# Sideloadly (Windows) com a conta Apple gratuita do dono do aparelho.
# Roda no runner macOS padrão, que é gratuito em repositório público.

on:
  push:
    branches: [master, 'feat/**']
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (Xcode / SDK)
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          ls /Applications | grep -i '^Xcode' || true

      - name: Build (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild \
            -project HermesMobile.xcodeproj \
            -scheme HermesMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > "$RUNNER_TEMP/build.log" 2>&1 || {
              echo "=== BUILD FALHOU — erros ==="
              grep -nE "error:|error " "$RUNNER_TEMP/build.log" | head -60 || true
              echo
              echo "=== últimas 150 linhas do log ==="
              tail -n 150 "$RUNNER_TEMP/build.log"
              exit 1
            }
          echo "=== build OK — últimas 30 linhas ==="
          tail -n 30 "$RUNNER_TEMP/build.log"

      - name: Empacotar IPA
        run: |
          set -euo pipefail
          APP_DIR=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name "HermesMobile.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "não achei HermesMobile.app — conteúdo de Build/Products:"
            find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 | head -40
            exit 1
          fi
          echo "app: $APP_DIR"
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_DIR" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry HermesMobile-unsigned.ipa Payload
          echo "=== conteúdo do IPA ==="
          unzip -l HermesMobile-unsigned.ipa | head -25
          echo "=== extensões embutidas ==="
          ls Payload/HermesMobile.app/PlugIns 2>/dev/null || echo "(sem PlugIns)"
          echo "=== tamanho / hash ==="
          du -h HermesMobile-unsigned.ipa
          shasum -a 256 HermesMobile-unsigned.ipa | tee sha256.txt

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: HermesMobile-unsigned-ipa
          path: ${{ runner.temp }}/ipa/HermesMobile-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
